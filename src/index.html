<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEOSiri Task Sentinel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      border: 1px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 16px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 10px;
      font-family: monospace;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
    }
    .stat-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-card span { font-size: 10px; color: #64748b; text-transform: uppercase; display: block; }
    .stat-card strong { font-size: 18px; font-weight: 800; font-family: monospace; }
    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .task-item {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .task-title { font-size: 12px; font-weight: 700; color: #f1f5f9; }
    .task-meta { font-size: 10px; color: #64748b; font-family: monospace; display: flex; justify-content: space-between; }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .btn {
      flex: 1;
      padding: 6px;
      border-radius: 6px;
      border: none;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      font-family: monospace;
    }
    .btn-start { background: #0284c7; color: #fff; }
    .btn-done { background: #059669; color: #fff; }
    footer {
      padding: 10px 16px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-family: monospace;
    }
    footer a { color: #38bdf8; text-decoration: none; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div>
      <div style="font-size: 13px; font-weight: 800; color: #fff;">SEOSiri Task Sentinel</div>
      <div style="font-size: 10px; color: #64748b; font-family: monospace;" id="employeeTag">ETMAGJUMR62</div>
    </div>
    <span class="badge" id="onlineBadge">ONLINE &bull; &lt;15MB RAM</span>
  </header>

  <div class="grid">
    <div class="stat-card">
      <span>Active Tasks</span>
      <strong style="color: #38bdf8;" id="activeCount">--</strong>
    </div>
    <div class="stat-card">
      <span>Urgent Queue</span>
      <strong style="color: #f43f5e;" id="urgentCount">--</strong>
    </div>
  </div>

  <div class="task-list" id="taskContainer">
    <div style="text-align: center; color: #64748b; font-size: 11px; padding: 30px 0;">
      Polling Edge Telemetry...
    </div>
  </div>

  <footer>
    <span>tasks.seosiri.com</span>
    <a id="openBoardBtn">Launch Board &rarr;</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
